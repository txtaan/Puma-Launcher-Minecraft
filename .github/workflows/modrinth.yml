name: Publish the mod on Modrinth

# Puts the Polymarket Prediction Market mod on Modrinth, which is where Aternos installs mods from
# (.github/scripts/modrinth-publish.sh does the work). The release workflow runs it after every release; run it from the
# Actions tab to publish a release that came out before the MODRINTH_TOKEN secret was added.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'The release whose mod to publish (e.g. v0.5.1). Leave empty for the latest release.'
        required: false
        type: string
  workflow_call:
    inputs:
      release:
        required: true
        type: string
      optional:
        description: 'Skip quietly when the MODRINTH_TOKEN secret is not set.'
        required: false
        type: boolean
        default: false
    secrets:
      MODRINTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish the mod on Modrinth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          OPTIONAL: ${{ inputs.optional }}
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: .github/scripts/modrinth-publish.sh "$RELEASE"
