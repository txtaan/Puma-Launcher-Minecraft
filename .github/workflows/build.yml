name: Build installers

# Builds the launcher for Windows, macOS (Intel + Apple Silicon) and Linux.
# - Every push / pull request: installers are attached to the run as downloadable artifacts.
# - Pushing a tag like v0.3.0, or running it manually from the Actions tab with a "release" version:
#   the installers are also published as a GitHub Release (the tag is created if it doesn't exist), together with
#   the Polymarket Billboard mod's .jar, which the launcher installs from there. If the MODRINTH_TOKEN secret and the
#   MODRINTH_PROJECT_ID variable are set, the mod is also published on Modrinth.
#   A manual run with "mac" unticked builds only Windows and Linux; a later manual run for the same version
#   with "mac" ticked adds the macOS installers to that release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with this version tag (e.g. v0.3.0). Leave empty to only build.'
        required: false
        type: string
      mac:
        description: 'Build the macOS installers. Untick to build (and release) only Windows and Linux.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # A new push cancels the previous push build of the same branch, but never a release run (manual or tag).
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.name == 'Windows' && 'windows-latest' || matrix.name == 'macOS' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform, except in a manual run with "mac" unticked.
        name: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.mac) && '["Windows", "macOS", "Linux"]' || '["Windows", "Linux"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installers
        shell: bash
        run: npx electron-vite build && npx electron-builder ${{ matrix.name == 'Windows' && '--win' || matrix.name == 'macOS' && '--mac' || '--linux' }} --publish never
        env:
          # No signing certificates are configured: macOS builds are ad-hoc signed (see package.json),
          # Windows builds are unsigned. Add CSC_LINK / CSC_KEY_PASSWORD secrets later to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: PumaLauncher-${{ matrix.name }}
          # latest*.yml and the .blockmap files are what the launcher's built-in updater reads from a release.
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  mod:
    name: Polymarket mod
    # Release runs only: the jar goes into the release next to the installers.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods/polymarket
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: polymarket-billboard
          path: mods/polymarket/build/libs/polymarket-billboard-*.jar
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [build, mod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Puma Launcher ${{ inputs.release || github.ref_name }}
          files: dist/*
          generate_release_notes: true

      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      # Puts a "which file do I download?" table at the top of the release description (rebuilt on every run,
      # so the macOS rows appear once a later run adds the macOS installers).
      - name: Add the download guide to the release notes
        run: .github/scripts/release-download-guide.sh "${{ inputs.release || github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

  modrinth:
    name: Publish the mod on Modrinth
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [mod, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: polymarket-billboard
          path: mod

      # Skipped until the project exists on Modrinth: add a MODRINTH_TOKEN secret (a personal access token with the
      # "Create versions" scope) and a MODRINTH_PROJECT_ID repository variable. A mod version already on Modrinth
      # isn't uploaded again. game_versions must match the Minecraft range in the mod's mods.toml.
      - name: Upload the jar
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_PROJECT_ID" ]; then
            echo "Modrinth isn't set up (MODRINTH_TOKEN secret, MODRINTH_PROJECT_ID variable): skipping."
            exit 0
          fi
          ua="txtaan/Puma-Launcher-Minecraft (release workflow)"
          jar="$(ls mod/polymarket-billboard-*.jar | head -n 1)"
          version="$(basename "$jar" .jar)"
          version="${version#polymarket-billboard-}"
          existing="$(curl -fsS -H "User-Agent: $ua" "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID/version" \
            | jq --arg v "$version" '[.[] | select(.version_number == $v)] | length')"
          if [ "$existing" != "0" ]; then
            echo "Polymarket Billboard $version is already on Modrinth."
            exit 0
          fi
          data="$(jq -n --arg v "$version" --arg p "$MODRINTH_PROJECT_ID" --arg tag "$TAG" '{
            name: "Polymarket Billboard \($v)", version_number: $v, changelog: "Released with Puma Launcher \($tag).",
            dependencies: [], game_versions: ["26.3"], loaders: ["forge"], version_type: "release",
            featured: true, status: "listed", project_id: $p, file_parts: ["file"], primary_file: "file"
          }')"
          curl -fsS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $ua" \
            --form-string "data=$data" -F "file=@$jar;type=application/java-archive"
          echo
          echo "Published Polymarket Billboard $version on Modrinth."
