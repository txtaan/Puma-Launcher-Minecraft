name: Build installers

# Builds the launcher for Windows, macOS (Intel + Apple Silicon) and Linux.
# - Every push / pull request: installers are attached to the run as downloadable artifacts.
# - Pushing a tag like v0.3.0, or running it manually from the Actions tab with a "release" version:
#   the installers are also published as a GitHub Release (the tag is created if it doesn't exist).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with this version tag (e.g. v0.3.0). Leave empty to only build.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A new push cancels the previous push build of the same branch, but never a release run (manual or tag).
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installers
        shell: bash
        run: npx electron-vite build && npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates are configured: macOS builds are ad-hoc signed (see package.json),
          # Windows builds are unsigned. Add CSC_LINK / CSC_KEY_PASSWORD secrets later to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: PumaLauncher-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Puma Launcher ${{ inputs.release || github.ref_name }}
          files: dist/*
          generate_release_notes: true
