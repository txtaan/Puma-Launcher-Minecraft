name: Delete releases

# Run manually from the Actions tab to delete GitHub Releases, e.g. "v0.2.0 v0.2.2".
# The installers attached to them are deleted with them. The git tags are kept unless
# "delete_tags" is ticked (a tag whose release is already gone can be deleted the same way).
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags of the releases to delete, separated by spaces (e.g. v0.2.0 v0.2.2)'
        required: true
        type: string
      delete_tags:
        description: 'Also delete the git tags'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  delete:
    name: Delete releases
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
          DELETE_TAGS: ${{ inputs.delete_tags }}
        run: |
          read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY"
            else
              echo "No release for $tag"
            fi
            if [ "$DELETE_TAGS" = true ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
              echo "Deleted tag $tag"
            fi
          done
