name: Delete releases

# Run manually from the Actions tab to delete GitHub Releases, e.g. "v0.2.0 v0.2.2".
# The installers attached to them are deleted with them; the git tags are kept.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags of the releases to delete, separated by spaces (e.g. v0.2.0 v0.2.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    name: Delete releases
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY"
          done
