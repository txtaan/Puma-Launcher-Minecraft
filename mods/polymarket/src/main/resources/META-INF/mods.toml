[[mods]]
modId="polymarket_billboard"
version="${file.jarVersion}"
displayName="Polymarket Billboard"
authors="Puma Launcher"
description='''A billboard that shows Polymarket's live "Bitcoin Up or Down - 5 minute" market: the Up and Down probabilities, a chart that moves with them, and a countdown to the end of each window. Right-click it to paper-trade the market with virtual dollars at the real order-book prices.

Market data from Polymarket. Paper trading only: no real money, no account.'''

[[dependencies.polymarket_billboard]]
