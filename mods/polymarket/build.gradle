plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.1.0'
group = 'dev.puma.polymarket'
base.archivesName = 'polymarket-prediction-market'

// Minecraft 26.x runs on Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.2')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forge fills in the mods.toml's ${file.jarVersion} from this.
tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'Polymarket Prediction Market',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Puma Launcher'
        )
    }
}
